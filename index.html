<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Monolith - Open World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #gameContainer {
            position: relative;
            border: 4px solid #444;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
            background: #2d5016;
        }

        #controls {
            margin-top: 15px;
            color: #aaa;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        #controls kbd {
            background: #333;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid #555;
            color: #fff;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🚗 GTA MONOLITH</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="960" height="544"></canvas>
    </div>
    <div id="controls">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> Move &nbsp;|&nbsp;
        <kbd>SPACE</kbd> Shoot / Crime &nbsp;|&nbsp;
        <kbd>ENTER</kbd> or <kbd>F</kbd> Enter/Exit Vehicle &nbsp;|&nbsp;
        <kbd>ENTER</kbd> Start
    </div>
    <script src="game.js"></script>
</body>
</html>
